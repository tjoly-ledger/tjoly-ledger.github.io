<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#07070f"/>

  <!-- Chip body -->
  <rect x="9" y="9" width="14" height="14" rx="2.5" stroke="#00d4aa" stroke-width="1.5"/>

  <!-- Inner core -->
  <rect x="12.5" y="12.5" width="7" height="7" rx="1.5" fill="#00d4aa" opacity="0.18"/>
  <rect x="14" y="14" width="4" height="4" rx="1" fill="#00d4aa" opacity="0.7"/>

  <!-- Pins — top -->
  <line x1="13.5" y1="9"  x2="13.5" y2="6"  stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="18.5" y1="9"  x2="18.5" y2="6"  stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Pins — bottom -->
  <line x1="13.5" y1="23" x2="13.5" y2="26" stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="18.5" y1="23" x2="18.5" y2="26" stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Pins — left -->
  <line x1="9"  y1="13.5" x2="6"  y2="13.5" stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="9"  y1="18.5" x2="6"  y2="18.5" stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Pins — right -->
  <line x1="23" y1="13.5" x2="26" y2="13.5" stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="23" y1="18.5" x2="26" y2="18.5" stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round"/>
</svg>
